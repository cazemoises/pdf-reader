name: Deploy pdf-reader

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    # Runs on the VM itself via the self-hosted runner (see
    # ../orchestrator/deploy/setup-runner.md) - no inbound SSH needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend/cmd/server exists
        id: check-backend
        run: |
          if test -d backend/cmd/server; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip backend - cmd/server not implemented yet
        if: steps.check-backend.outputs.exists != 'true'
        run: echo "::notice::backend/cmd/server does not exist yet - skipping backend build/deploy steps. Expected until the orchestrator's Dev agent adds it; not a failure."

      - name: Build backend image
        if: steps.check-backend.outputs.exists == 'true'
        run: docker build -t pdf-reader-backend:latest ./backend

      - name: Build extractor image
        run: docker build -t pdf-reader-extractor:latest ./extractor

      - name: Check frontend/package-lock.json exists
        id: check-frontend
        run: |
          if test -f frontend/package-lock.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip frontend - package-lock.json not committed yet
        if: steps.check-frontend.outputs.exists != 'true'
        run: echo "::notice::frontend/package-lock.json does not exist yet - skipping frontend build/deploy steps. Expected until npm install is run locally and the lockfile is committed; not a failure."

      - name: Set up Node
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build frontend image
        if: steps.check-frontend.outputs.exists == 'true'
        run: docker build -t pdf-reader-frontend:latest ./frontend

      - name: Bring the stack up
        env:
          BACKEND_READY: ${{ steps.check-backend.outputs.exists }}
          FRONTEND_READY: ${{ steps.check-frontend.outputs.exists }}
        run: |
          SERVICES="postgres extractor"

          if [ "$BACKEND_READY" = "true" ]; then
            SERVICES="$SERVICES backend"
          else
            echo "::notice::Skipping backend service in docker compose up - backend/cmd/server does not exist yet."
          fi

          # frontend depends_on backend being healthy (see docker-compose.yml),
          # so it can only come up alongside a backend that is actually
          # starting - never on its own.
          if [ "$BACKEND_READY" = "true" ] && [ "$FRONTEND_READY" = "true" ]; then
            SERVICES="$SERVICES frontend"
          else
            echo "::notice::Skipping frontend service in docker compose up - requires both backend/cmd/server and frontend/package-lock.json to exist (frontend depends on a healthy backend)."
          fi

          docker compose up -d --build $SERVICES

      - name: Health check - extractor
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "extractor healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::extractor did not become healthy"
          docker compose logs extractor
          exit 1

      - name: Skip health check - backend
        if: steps.check-backend.outputs.exists != 'true'
        run: echo "::notice::Skipping backend health check - backend/cmd/server does not exist yet, service was not started."

      - name: Health check - backend
        if: steps.check-backend.outputs.exists == 'true'
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Skip health check - frontend
        if: steps.check-backend.outputs.exists != 'true' || steps.check-frontend.outputs.exists != 'true'
        run: echo "::notice::Skipping frontend health check - frontend/package-lock.json and/or backend/cmd/server do not exist yet, service was not started."

      - name: Health check - frontend
        if: steps.check-backend.outputs.exists == 'true' && steps.check-frontend.outputs.exists == 'true'
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8081/ >/dev/null; then
              echo "frontend healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::frontend did not become healthy"
          docker compose logs frontend
          exit 1
