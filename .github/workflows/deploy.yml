name: Deploy pdf-reader

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    # Runs on the VM itself via the self-hosted runner (see
    # ../orchestrator/deploy/setup-runner.md) - no inbound SSH needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pdf-reader-backend:latest ./backend

      - name: Build extractor image
        run: docker build -t pdf-reader-extractor:latest ./extractor

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build frontend image
        run: docker build -t pdf-reader-frontend:latest ./frontend

      - name: Bring the stack up
        run: docker compose up -d --build

      - name: Health check - extractor
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "extractor healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::extractor did not become healthy"
          docker compose logs extractor
          exit 1

      - name: Health check - backend
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Health check - frontend
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8081/ >/dev/null; then
              echo "frontend healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::frontend did not become healthy"
          docker compose logs frontend
          exit 1
