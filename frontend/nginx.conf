# Replaces the nginx base image's default server block. The built
# frontend calls the backend via bare relative paths (see
# frontend/src/api/client.ts, e.g. fetch("/books")) instead of an
# absolute URL, mirroring the Vite dev-server proxy in
# frontend/vite.config.ts. This config reproduces that proxy so the
# same frontend code works unmodified in the compose network.
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default of 1m is too small for real PDF uploads via
    # POST /books; 100m covers typical book-sized PDFs (tens of MB).
    client_max_body_size 100m;

    location /books {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8080;
    }

    # nginx's bundled mime.types has no .mjs entry, so pdf.js's worker
    # (emitted by the Vite build as pdf.worker-*.mjs) is served as
    # application/octet-stream and browsers refuse to import() it as an
    # ES module ("Setting up fake worker failed"). Map it explicitly.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
